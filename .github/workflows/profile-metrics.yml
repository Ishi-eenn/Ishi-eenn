name: Profile metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The generator lives in Ishi-eenn/profile-metrics (public).
      - name: Checkout generator
        uses: actions/checkout@v4
        with:
          repository: Ishi-eenn/profile-metrics
          path: generator

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: generator

      - name: Generate terminal.svg
        working-directory: generator
        env:
          # Prefer a PAT (private contributions); fall back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          METRICS_USER: Ishi-eenn
          METRICS_OUTPUT: card.svg # generated but unused here
          METRICS_TERMINAL_OUTPUT: ${{ github.workspace }}/terminal.svg
        run: npm start

      # Publish terminal.svg to the gist (GIST is a PAT with the "gist" scope).
      # The profile README references the gist raw URL.
      - name: Publish to gist
        env:
          GH_TOKEN: ${{ secrets.GIST }}
          GIST_ID: a56581b6b8c1976425bb67fbc649fc9c
        run: |
          jq -n --rawfile svg terminal.svg '{files: {"terminal.svg": {content: $svg}}}' \
            | gh api -X PATCH "gists/$GIST_ID" --input -
